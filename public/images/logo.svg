<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E0EAFF"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Map pin shape: circle top, tapers to point at bottom -->
  <path d="M50 11
    C 33 11, 19 25, 19 42
    C 19 54, 25 64, 35 72
    L 50 88
    L 65 72
    C 75 64, 81 54, 81 42
    C 81 25, 67 11, 50 11 Z"
    fill="url(#pinGrad)"
    filter="drop-shadow(0 2px 4px rgba(0,0,0,0.18))"
  />

  <!-- Inner circle cutout (shadow ring) -->
  <circle cx="50" cy="41" r="18" fill="none" stroke="#C7D9FF" stroke-width="1.5" opacity="0.6"/>

  <!-- "Ez" lettering inside pin -->
  <!-- E: vertical bar + 3 horizontals, path-based for crispness -->
  <!-- E vertical -->
  <rect x="28" y="30" width="5.5" height="24" rx="1.5" fill="#1E3A8A"/>
  <!-- E top bar -->
  <rect x="28" y="30" width="18" height="5" rx="1.5" fill="#1E3A8A"/>
  <!-- E mid bar -->
  <rect x="28" y="40" width="14" height="4.5" rx="1.5" fill="#1E3A8A"/>
  <!-- E bottom bar -->
  <rect x="28" y="49" width="18" height="5" rx="1.5" fill="#1E3A8A"/>

  <!-- z: top bar, diagonal, bottom bar -->
  <!-- z top bar -->
  <rect x="50" y="30" width="22" height="5" rx="1.5" fill="#1E3A8A"/>
  <!-- z diagonal (thin rotated rect approximated as a parallelogram path) -->
  <polygon points="68,35 72,35 52,54 48,54" fill="#1E3A8A"/>
  <!-- z bottom bar -->
  <rect x="50" y="49" width="22" height="5" rx="1.5" fill="#1E3A8A"/>

  <!-- Pin tip accent dot -->
  <circle cx="50" cy="85" r="3" fill="#60A5FA" opacity="0.7"/>
</svg>
